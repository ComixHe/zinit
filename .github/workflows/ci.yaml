name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # https://github.com/actions/runner-images/issues/14748
    runs-on: ubuntu-26.04
    env:
      # Three arguments, expanded unquoted below: one string would be read as the value of
      # the first option ("expected -Dtracing-child to be a boolean; received: true -D...").
      ZIG_FLAGS: -Dtracing-child=true -Dlog-level=debug -Ddefault-log-level=debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Format
        run: zig fmt --check .
      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y kcov
      - name: Build
        run: |
          # shellcheck disable=SC2086
          zig build $ZIG_FLAGS --summary all
      - name: Unit tests
        run: |
          kcov --version
          # shellcheck disable=SC2086
          zig build test $ZIG_FLAGS -Dtest-coverage=true --summary all
      - name: Smoke
        run: |
          # shellcheck disable=SC2086
          zig build smoke $ZIG_FLAGS --summary all
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: ./kcov-output
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          fail_ci_if_error: true

  # The artifact: the same bytes from a cold tree, and an SBOM that describes them.
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Packed release is reproducible, and the SBOM checks out
        run: |
          commit=$(git rev-parse HEAD)
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH

          # Releases are stripped, so nothing path- or cache-dependent may survive:
          # build once off a warm .zig-cache and once from a fresh tree, then compare
          # the packed bytes. The tag-to-published comparison lives in Rebuild.
          rm -rf zig-out/artifacts
          # Warm .zig-cache in this mode, so the build below is the cached one.
          zig build -Doptimize=ReleaseSmall
          zig build release -Doptimize=ReleaseSmall -Dsbom=true -Dcommit="$commit"
          cp -r zig-out/artifacts /tmp/artifacts

          rm -rf /tmp/repro && mkdir -p /tmp/repro
          tar -cf - --exclude=./.git --exclude=./.zig-cache --exclude=./zig-out --exclude=./kcov-output . \
            | tar -xf - -C /tmp/repro
          ( cd /tmp/repro && zig build release -Doptimize=ReleaseSmall -Dsbom=true -Dcommit="$commit" )
          for f in /tmp/artifacts/*; do
            cmp "$f" "/tmp/repro/zig-out/artifacts/$(basename "$f")"
          done

          # The document has to be valid, conformant, and name its artifact.
          # ntia-checker validates against the SPDX spec as part of its check.
          pipx install --quiet ntia-conformance-checker

          sbom=$(ls zig-out/artifacts/*.spdx.json)
          ntia-checker -c ntia "$sbom"
          binary=$(tar xzOf zig-out/artifacts/*.tar.gz --wildcards '*/zinit' | sha256sum | cut -d' ' -f1)
          grep -q "$binary" "$sbom"
