name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux, aarch64-linux, riscv64-linux]
        optimize: [ReleaseSmall, ReleaseSafe]
    steps:
      # No step here needs git credentials, so keep the token out of .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # zizmor: ignore[cache-poisoning] cache writes already need repo write access. v2.2.1
      - name: Tag matches the manifest version
        run: |
          v=${GITHUB_REF_NAME#v}
          want=$(sed -n 's/.*\.version *= *"\([^"]*\)".*/\1/p' build.zig.zon)
          echo "tag=$v build.zig.zon=$want"
          [ "$v" = "$want" ]
      - name: Build and package
        run: |
          # tools/release.zig writes the archive through std's tar/gzip writers,
          # so the payload -- not just the binary in it -- is reproducible.
          # SOURCE_DATE_EPOCH fixes the SBOM date, the archives are epoch-pinned.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          zig build release \
            -Doptimize=${{ matrix.optimize }} \
            -Dtarget=${{ matrix.target }} \
            -Dsbom=true -Dcommit=${{ github.sha }}
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.optimize }}-${{ matrix.target }}
          path: 'zig-out/artifacts/*'
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-26.04
    # Protecting this environment (required reviewers) is what stops a
    # compromised token from publishing on its own.
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect the artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.spdx.json > SHA256SUMS
          cat SHA256SUMS
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Stated explicitly: this decides the format of the bundles we sign,
          # and the action's own default is free to move.
          cosign-release: v3.0.6
      - name: Sign the artifacts
        run: |
          cd dist
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          for f in ./*.tar.gz ./*.spdx.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Verify the signed artifacts
        # A published release cannot be replaced, so check the bundles here
        # instead of trusting that signing did the right thing.
        run: |
          cd dist
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yaml@refs/tags/${GITHUB_REF_NAME}"
          issuer=https://token.actions.githubusercontent.com
          for f in ./*.tar.gz ./*.spdx.json SHA256SUMS; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              "$f"
          done
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/SHA256SUMS
      - name: Pin the image build timestamp
        # BuildKit takes SOURCE_DATE_EPOCH from the environment and pins the
        # image config and index annotations to it, so the image is as
        # reproducible as the tarballs it is packed from.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the artifact image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/riscv64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            MODE=ReleaseSmall
          provenance: mode=min
          sbom: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/comixhe/zinit:${{ github.ref_name }}
      - name: Build and push the artifact image (safe)
        id: image_safe
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/riscv64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            MODE=ReleaseSafe
          provenance: mode=min
          sbom: false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/comixhe/zinit:${{ github.ref_name }}-safe
      - name: Sign and verify the images
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          DIGEST_SAFE: ${{ steps.image_safe.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yaml@refs/tags/${{ github.ref_name }}
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          for digest in "$DIGEST" "$DIGEST_SAFE"; do
            cosign sign --yes "ghcr.io/comixhe/zinit@$digest"
            cosign verify \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              "ghcr.io/comixhe/zinit@$digest"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Immutable releases lock at publication, so attach the assets while
          # the release is still a draft.
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
